name: Tier census

# Collects one day of the PUBG ranked tier sample.
#
# It runs here rather than inside the API because the free Render service spins
# down after 15 minutes of inactivity, so an in-process timer would simply not
# exist at 03:00. This wakes the service instead, and Actions is free and
# unmetered on a public repository.
#
# The schedule is deliberately quiet-hours in Kyiv, though the audience is
# spread across the US, Asia and Europe so there is no truly idle window. That
# matters less than it sounds: the pacer holds a reserve the census never
# touches, so a live lookup keeps its quota either way.

# It also commits the reading it just collected, which is what puts the numbers
# in the static HTML: a Pages build runs no effects, so before this the one
# section nobody else publishes shipped as the words "Reading the latest
# sample…". The commit is what triggers the deploy that refreshes them, so this
# job is the page's update cadence.

on:
  schedule:
    # 03:10 Kyiv (UTC+3 in summer), and a preference rather than a requirement:
    # GitHub delivered this one 4h54m late. The API asks for a fixed calendar
    # day two days back, so a late fire collects exactly the same window.
    - cron: "10 0 * * *"
  workflow_dispatch:

# A late fire must not land on a run already going. The API refuses a second
# concurrent run anyway; this stops the queue building up behind it.
concurrency:
  group: tier-census
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The API stops itself at 80 minutes and the poll gives up at 100. Reaching
    # this cap means something is wrong rather than slow.
    timeout-minutes: 120
    # The snapshot step pushes one commit back to the branch.
    permissions:
      contents: write
    env:
      API: https://api.pubgtracker.top
      SNAPSHOT: frontend/src/data/tierCensus.json
    steps:
      - uses: actions/checkout@v4

      - name: Ask the API to collect today's sample
        env:
          CENSUS_TOKEN: ${{ secrets.CENSUS_TOKEN }}
        run: |
          if [ -z "$CENSUS_TOKEN" ]; then
            echo "CENSUS_TOKEN is not set in repository secrets"
            exit 1
          fi
          auth="Authorization: Bearer $CENSUS_TOKEN"

          # The service is asleep; waking it takes up to a minute.
          echo "Waking the API..."
          curl -sS -o /dev/null -m 120 "$API/api/player/live" || true

          # The run outlives this request. It used to BE this request, and
          # Render's proxy cut the connection at thirty minutes: the job saw a
          # 502, and because rows were written in one closing batch, an hour of
          # PUBG quota went with it.
          echo "Starting the census..."
          start=$(curl -sS -m 60 -X POST -H "$auth" "$API/api/census/run")
          echo "$start"

          started=$(printf '%s' "$start" | jq -r '.data.started // false' 2>/dev/null || echo false)
          reason=$(printf '%s' "$start" | jq -r '.data.reason // ""' 2>/dev/null || echo "")
          if [ "$started" = "true" ]; then
            echo "Started."
          elif [ "$reason" != "" ]; then
            echo "::warning::a run was already going ($reason); following that one instead"
          else
            echo "::error::the run did not start -- see the body above"
            exit 1
          fi

          # Polling is not only how the outcome comes back. A free Render
          # instance spins down after 15 minutes without inbound traffic, and
          # its own background work does not count as traffic, so this loop is
          # also what keeps the census alive. Do not stretch the interval.
          deadline=$(( $(date +%s) + 100 * 60 ))
          state=running
          status=""
          while [ "$state" = "running" ]; do
            sleep 60
            status=$(curl -sS -m 60 -H "$auth" "$API/api/census/status" || echo '{}')
            state=$(printf '%s' "$status" | jq -r '.data.state // "unreachable"' 2>/dev/null || echo unreachable)
            progress=$(printf '%s' "$status" | jq -c '.data.progress // {}' 2>/dev/null || echo '{}')
            echo "$(date -u +%H:%M:%S)  $state  $progress"

            # A blip while the instance is busy is not a failure; the next poll
            # picks the thread back up.
            if [ "$state" = "unreachable" ]; then
              state=running
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::still running after 100 minutes"
              exit 1
            fi
          done

          echo "$status" | jq . 2>/dev/null || echo "$status"

          if [ "$state" != "done" ]; then
            echo "::error::the run ended in state '$state' -- see the body above"
            exit 1
          fi

          window=$(printf '%s' "$status" | jq -r '.data.result.windowDate // ""')
          stored=$(printf '%s' "$status" | jq -r '.data.result.stored // 0')
          aborted=$(printf '%s' "$status" | jq -r '.data.result.aborted // false')
          skipped=$(printf '%s' "$status" | jq -r '.data.result.skipped // false')
          why=$(printf '%s' "$status" | jq -r '.data.result.skipReason // "it is already in the table"')

          if [ -z "$window" ] || [ "$window" = "null" ]; then
            echo "::error::the census finished without reporting a window"
            exit 1
          fi

          # Nothing stored and nothing wrong: the day was already in the table,
          # or it straddles a season reset and belongs to neither season.
          # Either way the run stopped before spending a single player read.
          if [ "$skipped" = "true" ]; then
            echo "::notice::$window was not collected -- $why; the run stopped without spending quota"
            exit 0
          fi
          if [ "$stored" -eq 0 ]; then
            echo "::error::the run stored no rows"
            exit 1
          fi
          if [ "$aborted" = "true" ]; then
            echo "::warning::the run aborted early; today's sample is partial"
          fi

          echo "Stored $stored rows for $window."

      # Only after a healthy collection, which is also what the "already
      # collected" early exit above counts as: while the pipeline is broken the
      # page should keep the last good reading, and the window printed beside
      # the table is what tells a reader how old it is.
      - name: Commit the reading the page renders
        id: commit
        run: |
          # Read the endpoint /ranks itself reads, not the database: the file
          # and the live fetch then cannot differ in shape, only in age.
          body=$(curl -sS -m 120 "$API/api/census/distribution?days=7")

          # A publishable tier is not enough: it has to be a tier on the
          # ladder. The first run after a reset measures a day of the previous
          # season's lobbies against the new season's ladder, and the unranked
          # bucket comes back holding 100% of the sample -- publishable by
          # every test, and not a distribution. Committing that once was enough
          # to put "Unranked 100.0%" in the static HTML and in the two data
          # files people are asked to cite.
          #
          # And a ladder tier is not enough either, which cost the same two
          # files again on 2026-09-13. By the second day of a reset people have
          # placed, so five rungs cleared the bar off ONE day of lobbies -- 145
          # matches -- and it replaced a pooled week of season 42 with Gold at
          # 39.4% against 29.0%. Both gates are about the same mistake: a tier's
          # own statistics say how often it was seen, never whether the days
          # behind it are representative. The window count is the only thing
          # that answers that, so it is asked for here.
          #
          # 3 is MIN_WINDOWS in backend/controllers/census.js and
          # MIN_POOLED_WINDOWS in frontend/src/helpers/censusSnapshot.js. Three
          # hand-typed literals, because no two of these layers can read each
          # other; censusSnapshot.test.js pins the frontend one to this value.
          usable=$(printf '%s' "$body" | jq -r \
            '(.status == 200)
             and ((.data.windows // 0) >= 3)
             and ((.data.tiers // []) | map(select(.publishable and .tier != "unranked")) | length > 0)' \
            2>/dev/null || echo false)
          if [ "$usable" != "true" ]; then
            echo "::warning::the distribution came back unusable; keeping the committed reading"
            printf '%s' "$body" | head -c 400
            exit 0
          fi

          # rpPercentiles is here deliberately, against the note that used to
          # say a hundred rows of RP would be noise in a file about tier shares.
          # That was true while nothing rendered them; /rank-points does. It
          # rides in THIS file rather than a second one so the RP table and the
          # tier shares cannot come to name different seasons or windows -- they
          # share one capturedAt and one seasonId by construction.
          #
          # In a file rather than a shell variable so no layer has to quote a
          # multi-line jq program correctly. This is also exactly what was run
          # against a live payload before shipping it.
          # benchmarks is field-projected the same way tiers is, below: the
          # collector fields a metric object carries (n, effectiveN,
          # designEffect, clusterSize, lobbies) are needed to COMPUTE the
          # numbers, but nothing the frontend reads asks for them again once
          # they have been -- censusSnapshot.js's benchmarkRows() validates
          # only tier/accounts/publishable and each metric's mean (or share),
          # low and high, and StatsByRank.jsx additionally reads
          # metrics.damage.n to report how many of the window's accounts the
          # published table itself rests on. Shipping the rest would be bytes
          # nobody reads on every page load -- roughly 4-6 KB here, five
          # metrics deep across every published tier. `if == null` rather than
          # letting `[]` run on it: benchmarks is `null`, not `[]`, before the
          # window has three days carrying the new columns, and that is the
          # value usableSnapshot-style callers are written to check for.
          cat > "$RUNNER_TEMP/reading.jq" <<'JQ'
          {
            seasonId: .data.seasonId,
            current: .data.current,
            shard: .data.shard,
            days: .data.days,
            accounts: .data.accounts,
            matches: .data.matches,
            windows: .data.windows,
            firstDate: .data.firstDate,
            lastDate: .data.lastDate,
            perMatch: .data.perMatch,
            rpPercentiles: .data.rpPercentiles,
            lobbyMix: .data.lobbyMix,
            benchmarks: (if .data.benchmarks == null then null else
              [.data.benchmarks[] | {
                tier, accounts, publishable,
                metrics: {
                  damage: {mean: .metrics.damage.mean, low: .metrics.damage.low, high: .metrics.damage.high, n: .metrics.damage.n},
                  kills: {mean: .metrics.kills.mean, low: .metrics.kills.low, high: .metrics.kills.high},
                  minutesAlive: {mean: .metrics.minutesAlive.mean, low: .metrics.minutesAlive.low, high: .metrics.minutesAlive.high},
                  placement: {mean: .metrics.placement.mean, low: .metrics.placement.low, high: .metrics.placement.high},
                  noKillShare: {share: .metrics.noKillShare.share, low: .metrics.noKillShare.low, high: .metrics.noKillShare.high}
                }
              }]
            end),
            tiers: [.data.tiers[] | {tier, count, share, low, high, n, effectiveN, designEffect, publishable}]
          }
          JQ
          # capturedAt moves every run, so it is excluded from the comparison:
          # a commit a day that says nothing new is a deploy a day for nothing.
          #
          # Not -S here: $fresh is the value that ends up on disk, and it
          # should keep the order the projection above declares rather than an
          # alphabetised one -- a commit whose only change is every key moving
          # would still say "refresh the published tier distribution". -S is
          # applied further down, but only to a throwaway copy made for the
          # fresh/held comparison, so key order still cannot make two equal
          # readings differ there.
          fresh=$(printf '%s' "$body" | jq -f "$RUNNER_TEMP/reading.jq")

          # Hoisted above the splice below, which needs both: the held mix may
          # only stand in for a missing fresh one when the two name the same
          # season, and this is also the season-rollover check further down.
          was=$(jq -r '.seasonId // ""' "$SNAPSHOT" 2>/dev/null || echo "")
          now_season=$(printf '%s' "$body" | jq -r '.data.seasonId // ""')

          # The tier gate above says nothing about lobbyMix: the controller
          # builds it from a separate aggregator and answers with null when
          # that one throws, which must not freeze a good tier table -- but
          # committing that null over a good table is exactly what wiped it.
          # When the fresh reading has no usable mix, splice the held one back
          # in before anything else in this run reads or writes `fresh`. Only
          # when it is the SAME season, though: the two tables ride in one
          # file so they cannot name different seasons, and splicing a held
          # mix from a season that has since rolled over would do exactly
          # that -- last season's lobby mix under the new season's dates. When
          # the seasons disagree there is nothing safe to show, so it goes in
          # null instead.
          #
          # Being a non-empty array is not enough: frontend/src/helpers/
          # censusSnapshot.js's lobbyMixRows() additionally refuses a payload
          # with nothing publishable in it, same spirit as the tier gate above
          # (mirrors publishableReading there). A reading that is structurally
          # an array but has no row a reader can see must be treated exactly
          # like no reading at all, or this gate would report success while
          # spending the held mix's place on nothing and dropping the page to
          # its "still collecting" state.
          mix_usable=$(printf '%s' "$body" | jq -r \
            '((.data.lobbyMix // []) | type) == "array"
             and ((.data.lobbyMix // []) | length > 0)
             and ((.data.lobbyMix // []) | map(select(.publishable == true)) | length > 0)' \
            2>/dev/null || echo false)
          if [ "$mix_usable" != "true" ]; then
            if [ -n "$was" ] && [ "$was" = "$now_season" ]; then
              held_mix=$(jq -c '.lobbyMix // null' "$SNAPSHOT" 2>/dev/null || echo null)
              fresh=$(printf '%s' "$fresh" | jq --argjson heldMix "$held_mix" '.lobbyMix = $heldMix')
              echo "::warning::the fresh reading has no usable lobby mix; keeping the committed one"
            else
              fresh=$(printf '%s' "$fresh" | jq '.lobbyMix = null')
              echo "::warning::the fresh reading has no usable lobby mix, and the held snapshot is season $was against $now_season; writing null rather than misdating it"
            fi
          fi

          # -S on both sides here, purely for the comparison: key order must
          # not make two equal readings look different. $fresh itself stays in
          # the projection's own order for the write further down.
          held=$(jq -S 'del(.capturedAt)' "$SNAPSHOT" 2>/dev/null || echo null)
          fresh_cmp=$(printf '%s' "$fresh" | jq -S .)
          if [ "$fresh_cmp" = "$held" ]; then
            echo "::notice::the reading has not changed; nothing to commit"
            exit 0
          fi

          if [ -n "$was" ] && [ "$was" != "$now_season" ]; then
            # Ask the question articleSeason.test.js asks, which is not "did the
            # season move". The prose is allowed to be AHEAD of the table and
            # normally is: a season opens with no samples, so for its first days
            # the copy names a season the census cannot measure yet. Only the
            # copy falling BEHIND is a fault. Comparing against the file this
            # step is replacing cannot tell those apart, and on 2026-09-10 it
            # said "the ranks copy needs rewriting" about copy that had already
            # been rewritten -- an alarm nobody can act on.
            #
            # Committing anyway stays deliberate either way: the numbers and
            # their window are true, and it is the prose that a person rewrites.
            article=$(sed -n 's/.*ARTICLE_SEASON = "\([0-9][0-9]*\)".*/\1/p' \
              frontend/src/helpers/articleSeason.js)
            measured=$(printf '%s' "$now_season" | sed -n 's/.*-\([0-9][0-9]*\)$/\1/p')
            if [ -z "$article" ] || [ -z "$measured" ]; then
              echo "::warning::the season moved from $was to $now_season, and the season numbers could not be read -- check the ranks copy by hand"
            elif [ "$measured" -gt "$article" ]; then
              echo "::warning::the census now measures season $measured and the ranks copy is written about season $article -- it needs rewriting, and articleSeason.test.js stays red until it is"
            else
              echo "::notice::the season moved from $was to $now_season; the ranks copy already names season $article"
            fi
          fi

          # Not -S: this is the file the frontend and the public data files are
          # built from, and it should read in the projection's own order, not
          # an alphabetised one.
          printf '%s' "$fresh" | jq '{capturedAt: (now | todate)} + .' > "$SNAPSHOT"

          git config user.name "tier-census"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT"
          git commit -m "chore(census): refresh the published tier distribution"

          # Explicit refspec, and a rebase first: the checkout is minutes old by
          # the time the collection finishes, so a merge landing meanwhile would
          # otherwise reject the push and fail a job that did nothing wrong.
          # Only one generated file is in flight, so there is nothing to conflict.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "Committed $(jq -r '"\(.accounts) accounts, \(.firstDate) to \(.lastDate)"' "$SNAPSHOT")."
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The commit above is the one thing that reaches the branch without CI
      # ever seeing it: GitHub does not trigger workflows on a push made with
      # GITHUB_TOKEN. On 2026-09-15 the snapshot that first carried lobbyMix
      # turned a prerender test red and left it that way behind a wholly green
      # Actions list -- the failure would have surfaced on whatever pull
      # request came next, wearing that request's name.
      #
      # The frontend only: the snapshot is a frontend data file and nothing
      # under backend/ reads it. `build` as well as `test`, because the
      # prerender runs at build time and is the step that actually renders
      # these numbers into the static files.
      #
      # After the push rather than before, and deliberately: the reading and
      # its window are true, so the pages should have them. What is stale in
      # that situation is the test, and this job failing is what says so.
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.committed == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prove the snapshot did not break the pages that render it
        if: steps.commit.outputs.committed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
