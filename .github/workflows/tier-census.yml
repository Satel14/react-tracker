name: Tier census

# Collects one day of the PUBG ranked tier sample.
#
# It runs here rather than inside the API because the free Render service spins
# down after 15 minutes of inactivity, so an in-process timer would simply not
# exist at 03:00. This wakes the service instead, and Actions is free and
# unmetered on a public repository.
#
# The schedule is deliberately quiet-hours in Kyiv, though the audience is
# spread across the US, Asia and Europe so there is no truly idle window. That
# matters less than it sounds: the pacer holds a reserve the census never
# touches, so a live lookup keeps its quota either way.

on:
  schedule:
    # 03:10 Kyiv (UTC+3 in summer). Ten past the hour on purpose -- GitHub's own
    # docs warn that scheduled runs are delayed most at the top of the hour.
    - cron: "10 0 * * *"
  workflow_dispatch:

# A late fire must not land on a run already going. The API refuses a second
# concurrent run anyway; this stops the queue building up behind it.
concurrency:
  group: tier-census
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A full run is under an hour. The API aborts itself before this, so hitting
    # the cap here means something is genuinely wrong rather than slow.
    timeout-minutes: 90
    steps:
      - name: Ask the API to collect today's sample
        env:
          CENSUS_TOKEN: ${{ secrets.CENSUS_TOKEN }}
        run: |
          if [ -z "$CENSUS_TOKEN" ]; then
            echo "CENSUS_TOKEN is not set in repository secrets"
            exit 1
          fi

          # The service is asleep. Waking it takes up to a minute, and curl's
          # own timeout has to outlast the whole collection, not just the wake.
          echo "Waking the API…"
          curl -sS -o /dev/null -m 120 https://api.pubgtracker.top/api/player/live || true

          echo "Running the census…"
          response=$(curl -sS -m 5400 -X POST \
            -H "Authorization: Bearer $CENSUS_TOKEN" \
            https://api.pubgtracker.top/api/census/run)

          echo "$response"

          # The API answers 200 with a message on a caught error, so success is
          # judged on the body rather than the status code.
          echo "$response" | grep -q '"windowDate"' || {
            echo "::error::the census did not report a window -- see the body above"
            exit 1
          }

          echo "$response" | grep -q '"aborted":true' && {
            echo "::warning::the run aborted early; the sample for today is partial"
          }

          exit 0
