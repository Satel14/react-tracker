name: Tier census

# Collects one day of the PUBG ranked tier sample.
#
# It runs here rather than inside the API because the free Render service spins
# down after 15 minutes of inactivity, so an in-process timer would simply not
# exist at 03:00. This wakes the service instead, and Actions is free and
# unmetered on a public repository.
#
# The schedule is deliberately quiet-hours in Kyiv, though the audience is
# spread across the US, Asia and Europe so there is no truly idle window. That
# matters less than it sounds: the pacer holds a reserve the census never
# touches, so a live lookup keeps its quota either way.

on:
  schedule:
    # 03:10 Kyiv (UTC+3 in summer), and a preference rather than a requirement:
    # GitHub delivered this one 4h54m late. The API asks for a fixed calendar
    # day two days back, so a late fire collects exactly the same window.
    - cron: "10 0 * * *"
  workflow_dispatch:

# A late fire must not land on a run already going. The API refuses a second
# concurrent run anyway; this stops the queue building up behind it.
concurrency:
  group: tier-census
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The API stops itself at 80 minutes and the poll gives up at 100. Reaching
    # this cap means something is wrong rather than slow.
    timeout-minutes: 120
    env:
      API: https://api.pubgtracker.top
    steps:
      - name: Ask the API to collect today's sample
        env:
          CENSUS_TOKEN: ${{ secrets.CENSUS_TOKEN }}
        run: |
          if [ -z "$CENSUS_TOKEN" ]; then
            echo "CENSUS_TOKEN is not set in repository secrets"
            exit 1
          fi
          auth="Authorization: Bearer $CENSUS_TOKEN"

          # The service is asleep; waking it takes up to a minute.
          echo "Waking the API..."
          curl -sS -o /dev/null -m 120 "$API/api/player/live" || true

          # The run outlives this request. It used to BE this request, and
          # Render's proxy cut the connection at thirty minutes: the job saw a
          # 502, and because rows were written in one closing batch, an hour of
          # PUBG quota went with it.
          echo "Starting the census..."
          start=$(curl -sS -m 60 -X POST -H "$auth" "$API/api/census/run")
          echo "$start"

          started=$(printf '%s' "$start" | jq -r '.data.started // false' 2>/dev/null || echo false)
          reason=$(printf '%s' "$start" | jq -r '.data.reason // ""' 2>/dev/null || echo "")
          if [ "$started" = "true" ]; then
            echo "Started."
          elif [ "$reason" != "" ]; then
            echo "::warning::a run was already going ($reason); following that one instead"
          else
            echo "::error::the run did not start -- see the body above"
            exit 1
          fi

          # Polling is not only how the outcome comes back. A free Render
          # instance spins down after 15 minutes without inbound traffic, and
          # its own background work does not count as traffic, so this loop is
          # also what keeps the census alive. Do not stretch the interval.
          deadline=$(( $(date +%s) + 100 * 60 ))
          state=running
          status=""
          while [ "$state" = "running" ]; do
            sleep 60
            status=$(curl -sS -m 60 -H "$auth" "$API/api/census/status" || echo '{}')
            state=$(printf '%s' "$status" | jq -r '.data.state // "unreachable"' 2>/dev/null || echo unreachable)
            progress=$(printf '%s' "$status" | jq -c '.data.progress // {}' 2>/dev/null || echo '{}')
            echo "$(date -u +%H:%M:%S)  $state  $progress"

            # A blip while the instance is busy is not a failure; the next poll
            # picks the thread back up.
            if [ "$state" = "unreachable" ]; then
              state=running
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::still running after 100 minutes"
              exit 1
            fi
          done

          echo "$status" | jq . 2>/dev/null || echo "$status"

          if [ "$state" != "done" ]; then
            echo "::error::the run ended in state '$state' -- see the body above"
            exit 1
          fi

          window=$(printf '%s' "$status" | jq -r '.data.result.windowDate // ""')
          stored=$(printf '%s' "$status" | jq -r '.data.result.stored // 0')
          aborted=$(printf '%s' "$status" | jq -r '.data.result.aborted // false')
          skipped=$(printf '%s' "$status" | jq -r '.data.result.skipped // false')

          if [ -z "$window" ] || [ "$window" = "null" ]; then
            echo "::error::the census finished without reporting a window"
            exit 1
          fi

          # Nothing stored and nothing wrong: the API found the day already in
          # the table and stopped before spending a single player read.
          if [ "$skipped" = "true" ]; then
            echo "::notice::$window is already collected; the run stopped without spending quota"
            exit 0
          fi
          if [ "$stored" -eq 0 ]; then
            echo "::error::the run stored no rows"
            exit 1
          fi
          if [ "$aborted" = "true" ]; then
            echo "::warning::the run aborted early; today's sample is partial"
          fi

          echo "Stored $stored rows for $window."
