<!DOCTYPE html>
<html lang="en">

<head>
  <!-- First thing in the document on purpose. On a player URL this starts the
       rank request straight away instead of at the end of the HTML -> bundle ->
       lazy-chunk chain, which was putting it on the wire at 394-563 ms. Filled
       in at build time by the inject-rank-preload plugin in vite.config.js;
       a no-op on every other page. -->
  <!--rank-preload-->

  <!-- Google Analytics. The snippet runs now and the library waits for load:
       the snippet only pushes onto dataLayer, so the pageview is recorded here
       and replayed when the library arrives, while its 165 KB stop competing
       with the page for a throttled connection. A visit abandoned before load
       goes uncounted, which was already largely true of the async tag. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-45MK19MZZS');
    window.addEventListener('load', function () {
      var tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-45MK19MZZS';
      document.head.appendChild(tag);
    });
  </script>

  <meta charset="utf-8" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2a900" />
  <meta name="description"
    content="Track PUBG stats on Steam, Xbox and PlayStation. Search by nickname to view K/D, ranked RP, match history and replays. No sign-up required." />
  <meta name="keywords"
    content="PUBG tracker, PUBG stats, PUBG player statistics, PUBG leaderboard, PUBG K/D ratio, PUBG win rate, PUBG ranked, PUBG Steam stats, PlayerUnknown's Battlegrounds stats, PUBG match history" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.pubgtracker.top/" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "PUBG Tracker",
    "url": "https://www.pubgtracker.top",
    "description": "Track PUBG stats on Steam, Xbox and PlayStation. Search by nickname to view K/D, ranked RP, match history and replays. No sign-up required.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <!-- Site-level and identical on every page, so no consumer rewrites it. It is
       what decides the name shown above the URL in a search result. -->
  <meta property="og:site_name" content="PUBG Tracker" />
  <meta property="og:url" content="https://www.pubgtracker.top/" />
  <meta property="og:title" content="PUBG Tracker - Player Stats & Leaderboards" />
  <meta property="og:description"
    content="Track PUBG stats on Steam, Xbox and PlayStation. Search by nickname to view K/D, ranked RP, match history and replays. No sign-up required." />
  <meta property="og:image" content="https://www.pubgtracker.top/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PUBG.TRACKER - player stats, match history and replays" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.pubgtracker.top/" />
  <meta name="twitter:title" content="PUBG Tracker - Player Stats & Leaderboards" />
  <meta name="twitter:description"
    content="Track PUBG stats on Steam, Xbox and PlayStation. Search by nickname to view K/D, ranked RP, match history and replays. No sign-up required." />
  <meta name="twitter:image" content="https://www.pubgtracker.top/og.png" />

  <link rel="apple-touch-icon" href="/logo.svg" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="/manifest.json" />
  <!-- The API and the fonts live on other origins; open their connections while
       the bundle is still downloading instead of after it runs. -->
  <link rel="preconnect" href="https://api.pubgtracker.top" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Preloaded rather than linked as a stylesheet: as a stylesheet it held the
       first paint for 798 ms on a throttled phone, for one kilobyte of CSS.
       display=swap was already on it, so text has always appeared in the
       fallback stack first -- this only changes when the swap may begin. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  </noscript>
  <title>PUBG Tracker - Player Stats & Leaderboards</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
